[package]
name = "form"
version = "0.47.3"
description = "Form - le Notion du crÃ©atif freelance"
edition = "2021"

[lib]
name = "form_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "blocking"] }
# Bibliothèque d'images (venue de Klippr) : miniatures, IA locale, suppression vers la Corbeille Windows.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
rayon = "1"
# Moteur d'IA local : ONNX Runtime, avec DirectML pour la carte graphique (repli sur le processeur).
ort = { version = "=2.0.0-rc.15", features = ["directml"] }
sha2 = "0.10"
base64 = "0.22"
trash = "5"
regex = "1"

# Outils de dessin vectoriel (plume, flèche blanche, crayon…) : le moteur de VectorCraft (MIT ou Apache-2.0), utilisé tel quel.
vectorcraft-engine = { git = "https://github.com/storytold/vectorcraft", rev = "e2a8280134a7c3c9b4e117ee668b9b3e7eb3e315", default-features = false }
vectorcraft-geom = { git = "https://github.com/storytold/vectorcraft", rev = "e2a8280134a7c3c9b4e117ee668b9b3e7eb3e315" }

# Les mêmes versions modifiées que VectorCraft utilise pour la lecture des PDF (nécessaires pour compiler son moteur).
[patch.crates-io]
hayro-syntax = { git = "https://github.com/storytold/craft-libs", rev = "a0916808f7d78bed8c7b90cdf937176015454a7f" }
hayro-interpret = { git = "https://github.com/storytold/craft-libs", rev = "a0916808f7d78bed8c7b90cdf937176015454a7f" }
hayro-jbig2 = { git = "https://github.com/storytold/craft-libs", rev = "a0916808f7d78bed8c7b90cdf937176015454a7f" }
hayro-cmap = { git = "https://github.com/storytold/craft-libs", rev = "a0916808f7d78bed8c7b90cdf937176015454a7f" }
hayro-postscript = { git = "https://github.com/storytold/craft-libs", rev = "a0916808f7d78bed8c7b90cdf937176015454a7f" }
krilla = { git = "https://github.com/storytold/craft-libs", rev = "a0916808f7d78bed8c7b90cdf937176015454a7f" }
