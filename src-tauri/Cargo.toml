[package]
name = "form"
version = "0.47.1"
description = "Form - le Notion du crÃ©atif freelance"
edition = "2021"

[lib]
name = "form_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
imap = "2.4"
native-tls = "0.2"
mailparse = "0.15"
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "blocking"] }
# Bibliothèque d'images (venue de Klippr) : miniatures, IA locale, suppression vers la Corbeille Windows.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
rayon = "1"
# Moteur d'IA local : ONNX Runtime, avec DirectML pour la carte graphique (repli sur le processeur).
ort = { version = "=2.0.0-rc.15", features = ["directml"] }
sha2 = "0.10"
base64 = "0.22"
trash = "5"
regex = "1"
