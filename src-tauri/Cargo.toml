[package]
name = "form"
version = "0.1.0"
description = "Form - le Notion du créatif freelance"
edition = "2021"

[lib]
name = "form_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
